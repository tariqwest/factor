[advisories]
ignore = [
    # quick-xml 0.37.x is only used by tauri-winrt-notification, a Windows-only
    # notification crate that is not compiled for Factor's v1 macOS/Linux targets.
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
    # rustls-webpki 0.101.x is pulled in by the AWS SDK's legacy rustls 0.21 stack.
    # Updating requires aws-smithy-http-client >=1.3.0, which requires Rust 1.94.1+.
    "RUSTSEC-2026-0098",
    "RUSTSEC-2026-0099",
    "RUSTSEC-2026-0104",
    # rkyv 0.7.46 is no longer in the build dependency graph (Cargo.lock orphan) but
    # still appears in the lockfile for a dropped target/dependency.
    "RUSTSEC-2026-0235",
]
